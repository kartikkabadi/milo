<?xml version="1.0" encoding="UTF-8"?>
<!--
  milo favicon.

  The same two shapes, on a square crop so the mark fills the frame at 16px.
  A favicon that is 40% empty padding is a favicon nobody recognises.

  Colour is explicit rather than inherited: a favicon has no cascade to inherit
  from. This is the only place the mark carries a fixed colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 6.5 19.8 19.8" width="16" height="16" role="img" aria-label="milo">
  <title>milo</title>
  <path
    d="M8 7.5 Q16.5 11 25 7.5"
    fill="none"
    stroke="#E86A1F"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M14 15 V20 L17.5 20 V25 M14 18 L21.5 13 M21.5 13 h0.01"
    fill="none"
    stroke="#E86A1F"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
